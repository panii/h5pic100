<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Image Viewer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#eef2f7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{height:100%;width:100%;display:flex;flex-direction:column;writing-mode:horizontal-tb}.bar{width:100%;margin-top:34px;height:40px;min-height:40px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;padding:0 10px;background:#181b22;border-bottom:1px solid #2a2e38;flex:none}.title{font-size:14px;font-weight:600}.meta{font-size:11px;color:#9ea7b7;margin-left:7px;white-space:nowrap}.pick{border:0;border-radius:7px;background:#4f8cff;color:#fff;padding:6px 9px;font-size:12px}.stage{position:relative;flex:1;overflow:auto;background:#fff;display:flex;align-items:flex-start;justify-content:flex-start}.stage.empty{align-items:center;justify-content:center}.canvas-wrap{position:relative;min-width:100%;min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding:0}.canvas-wrap.fit{align-items:center;justify-content:center;padding:0}.canvas-wrap canvas{display:block;touch-action:none}.tip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#252a34dd;color:#cdd4df;border-radius:99px;padding:7px 12px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s}.tip.show{opacity:1}
</style></head>
<body><div class="app"><div class="bar"><div><span class="title">Image Viewer</span><span class="meta" id="meta"></span></div><label class="pick">Open Image<input id="file" type="file" accept="image/*" hidden></label></div><main class="stage empty" id="stage"><div class="canvas-wrap" id="wrap" hidden><canvas id="canvas"></canvas></div></main><div class="tip" id="tip">Double-tap to toggle Fit / 1:1</div></div>
<script>
const input=document.getElementById('file'),stage=document.getElementById('stage'),wrap=document.getElementById('wrap'),canvas=document.getElementById('canvas'),meta=document.getElementById('meta'),tip=document.getElementById('tip');let img=null,fit=false,lastTap=0;
function render(){if(!img)return;const dpr=Math.max(1,Math.min(3,devicePixelRatio||1)),vw=stage.clientWidth,vh=stage.clientHeight;let scale=fit?Math.min(vw/img.naturalWidth,vh/img.naturalHeight):1/dpr;if(!isFinite(scale)||scale<=0)scale=1;const cssW=Math.max(1,Math.round(img.naturalWidth*scale)),cssH=Math.max(1,Math.round(img.naturalHeight*scale));canvas.style.width=cssW+'px';canvas.style.height=cssH+'px';canvas.width=Math.round(cssW*dpr);canvas.height=Math.round(cssH*dpr);const ctx=canvas.getContext('2d');ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.clearRect(0,0,img.naturalWidth,img.naturalHeight);ctx.drawImage(img,0,0);wrap.classList.toggle('fit',fit);meta.textContent=(fit?canvas.width+' \u00d7 '+canvas.height:img.naturalWidth+' \u00d7 '+img.naturalHeight)+' px \u00b7 '+Math.round(canvas.width/img.naturalWidth*100)+'% \u00b7 DPR '+dpr.toFixed(2)+(fit?' \u00b7 Fit to Screen':' \u00b7 Actual Size');stage.scrollLeft=0;stage.scrollTop=0}
input.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);const next=new Image();next.onload=()=>{img=next;fit=false;stage.classList.remove('empty');wrap.hidden=false;render();tip.classList.add('show');setTimeout(()=>tip.classList.remove('show'),2200);URL.revokeObjectURL(url)};next.src=url});
function toggle(){if(!img)return;fit=!fit;render()}
canvas.addEventListener('dblclick',toggle);canvas.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTap<320){e.preventDefault();toggle()}lastTap=now},{passive:false});window.addEventListener('resize',()=>{if(fit)render()});
</script></body></html>
